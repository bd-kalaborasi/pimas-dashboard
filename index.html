<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <!-- Favicon inline kosong — mencegah 404 /favicon.ico di console (DoD SPEC §10) -->
  <link rel="icon" href="data:,">
  <title>PIMAS — Dashboard</title>

  <!-- Tema dipasang sebelum paint untuk menghindari flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('pimas.theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/ios.css">

  <!-- CDN pinned (SPEC §6) — Alpine WAJIB paling akhir agar pimasApp() sudah terdefinisi -->
  <script defer src="assets/crypt.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
  <script defer src="assets/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>

<body x-data="pimasApp()">

  <!-- ============ BOOT (tampil sebelum Alpine siap & saat auto-login) ============ -->
  <div class="boot" x-show="stage === 'boot'">
    <span class="spinner spinner-accent"></span>
    <span>Menyiapkan dashboard…</span>
  </div>

  <!-- ============ LOGIN ============ -->
  <div class="login-wrap" x-show="stage === 'login'" x-cloak>
    <div class="login-card" :class="{ shake: shake }">
      <div class="login-logo">PIMAS</div>
      <p class="login-sub">Product Intelligence Multi-Agent System</p>
      <form @submit.prevent="login()">
        <label class="field">
          <span>ID</span>
          <input class="input" type="text" x-model="loginId" autocomplete="username"
                 autocapitalize="none" spellcheck="false" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input class="input" type="password" x-model="loginPass"
                 autocomplete="current-password" required>
        </label>
        <label class="check-row">
          <input type="checkbox" x-model="remember">
          <span>Ingat sesi ini (tab ini saja)</span>
        </label>
        <button class="btn-primary" type="submit" :disabled="busy">
          <span class="spinner" x-show="busy"></span>
          <span x-text="busy ? 'Membuka kunci…' : 'Masuk'"></span>
        </button>
        <p class="login-error" x-show="loginError" x-text="loginError" x-cloak></p>
      </form>
      <p class="login-foot">Data terenkripsi AES-256-GCM · kunci diturunkan di perangkatmu</p>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div x-show="stage === 'app'" x-cloak>

    <!-- Header glass -->
    <header class="topbar">
      <div class="brand">
        <span class="logo">PIMAS</span>
        <span class="badge badge-accent" x-show="data?.phase?.mode" x-text="data?.phase?.mode"></span>
      </div>
      <div class="top-right">
        <span class="stamp" x-text="stampText"></span>
        <button class="icon-btn" @click="toggleTheme()"
                :title="theme === 'dark' ? 'Mode terang' : 'Mode gelap'"
                :aria-label="theme === 'dark' ? 'Mode terang' : 'Mode gelap'">
          <svg x-show="theme === 'dark'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
          </svg>
          <svg x-show="theme !== 'dark'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 13A8.5 8.5 0 1 1 11 3a7 7 0 0 0 10 10z"/>
          </svg>
        </button>
        <button class="btn-ghost" @click="logout()">Keluar</button>
      </div>
    </header>

    <div class="layout">

      <!-- Sidenav (desktop) / tab-bar (mobile) -->
      <nav class="sidenav" aria-label="Navigasi utama">
        <button class="nav-btn" :class="{ active: view === 'overview' }" @click="go('overview')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/>
            <rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>
          </svg>
          <span>Ringkasan</span>
        </button>
        <button class="nav-btn" :class="{ active: view === 'agents' }" @click="go('agents')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.8-3.6 3.9-5.5 7.5-5.5s6.7 1.9 7.5 5.5"/>
          </svg>
          <span>Agen</span>
        </button>
        <button class="nav-btn" :class="{ active: view === 'pipeline' }" @click="go('pipeline')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="5" cy="12" r="2.4"/><circle cx="19" cy="5.5" r="2.4"/><circle cx="19" cy="18.5" r="2.4"/>
            <path d="M7.3 11 16.7 6.6M7.3 13l9.4 4.4"/>
          </svg>
          <span>Pipeline</span>
        </button>
        <button class="nav-btn" :class="{ active: view === 'reports' }" @click="go('reports')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2.5h7.5L18.5 7.5V21.5H6z"/><path d="M13.5 2.5v5h5"/><path d="M9 12.5h6.5M9 16h6.5"/>
          </svg>
          <span>Laporan</span>
        </button>
        <button class="nav-btn" :class="{ active: view === 'ops' }" @click="go('ops')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15l3.5-4.5"/><path d="M4 19h16"/>
          </svg>
          <span>Ops</span>
        </button>
        <button class="nav-btn" :class="{ active: view === 'feedback' }" @click="go('feedback')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8 8 0 0 1-8 8H4l1.8-2.9A8 8 0 1 1 21 11.5z"/>
          </svg>
          <span>Feedback</span>
        </button>
      </nav>

      <main x-show="data">

        <!-- ============ VIEW: OVERVIEW ============ -->
        <template x-if="view === 'overview' && data">
          <section class="view">
            <div class="grid-2">
              <div class="card">
                <p class="eyebrow">Fase sistem</p>
                <h2 class="h-large" x-text="data.phase?.mode || '—'"></h2>
                <p class="muted" style="margin:10px 0 0" x-text="data.phase?.note || ''"></p>
              </div>
              <div class="card">
                <p class="eyebrow">Berikutnya jalan</p>
                <template x-if="!nextRuns.length">
                  <div class="empty">
                    <span class="emo">🌙</span>
                    <p>Tidak ada jadwal cron aktif saat ini.</p>
                  </div>
                </template>
                <ul class="run-list" x-show="nextRuns.length">
                  <template x-for="r in nextRuns.slice(0, 4)" :key="r.key">
                    <li>
                      <div style="min-width:0">
                        <span class="run-label" x-text="r.label"></span>
                        <span class="muted small" x-text="r.nextHuman"></span>
                      </div>
                      <span class="countdown" x-text="countdown(r.next)"></span>
                    </li>
                  </template>
                </ul>
              </div>
            </div>

            <h2 class="sec-title">Funnel kandidat</h2>
            <div class="stat-grid">
              <div class="stat">
                <span class="num" :data-count="data.funnel?.total || 0">0</span>
                <span class="lbl">Total kandidat</span>
              </div>
              <template x-for="f in funnelRows" :key="f.key">
                <div class="stat">
                  <span class="num" :data-count="f.value">0</span>
                  <span class="lbl" x-text="f.label"></span>
                </div>
              </template>
            </div>

            <h2 class="sec-title">Status agent</h2>
            <div class="card">
              <template x-if="!(data.agents || []).length">
                <div class="empty"><span class="emo">🤖</span><p>Belum ada agent terdaftar.</p></div>
              </template>
              <div class="agent-chips">
                <template x-for="a in data.agents || []" :key="a.id">
                  <button class="chip-agent" @click="gotoAgent(a)">
                    <span class="dot" :class="'dot-' + agentStatus(a)"></span>
                    <span x-text="a.nama || a.id"></span>
                  </button>
                </template>
              </div>
              <div class="legend muted small" x-show="(data.agents || []).length">
                <span><span class="dot dot-ok"></span> aktif, ada aktivitas ≤7 hari</span>
                <span><span class="dot dot-warn"></span> aktif, belum ada aktivitas baru</span>
                <span><span class="dot dot-err"></span> nonaktif</span>
              </div>
            </div>

            <h2 class="sec-title">Aktivitas terbaru</h2>
            <div class="card">
              <template x-if="!activityFeed.length">
                <div class="empty">
                  <span class="emo">📭</span>
                  <p>Belum ada aktivitas tercatat.</p>
                  <p class="small">Log akan muncul setelah agent mulai berjalan.</p>
                </div>
              </template>
              <ul class="feed" x-show="activityFeed.length">
                <template x-for="day in activityFeed" :key="day.date">
                  <li>
                    <span class="feed-date" x-text="fmtTanggal(day.date)"></span>
                    <ul>
                      <template x-for="(e, ei) in day.entries || []" :key="ei">
                        <li>
                          <span class="feed-skill" x-text="e.skill"></span>
                          <span x-text="e.summary"></span>
                        </li>
                      </template>
                    </ul>
                  </li>
                </template>
              </ul>
            </div>
          </section>
        </template>

        <!-- ============ VIEW: AGENTS ============ -->
        <template x-if="view === 'agents' && data">
          <section class="view">
            <h2 class="sec-title">
              Agen <span class="muted" x-text="'(' + (data.agents || []).length + ')'"></span>
            </h2>
            <template x-if="!(data.agents || []).length">
              <div class="card">
                <div class="empty"><span class="emo">🤖</span><p>Belum ada agent terdaftar.</p></div>
              </div>
            </template>
            <div class="agent-grid">
              <template x-for="a in data.agents || []" :key="a.id">
                <article class="card agent-card pressable" @click="openAgent(a)">
                  <div class="agent-head">
                    <span class="dot" :class="'dot-' + agentStatus(a)"></span>
                    <h3 x-text="a.nama || a.id"></h3>
                    <span class="badge badge-accent" x-text="a.model_short || '—'"></span>
                  </div>
                  <p class="agent-role" x-text="a.peran || '—'"></p>
                  <div class="meta-rows">
                    <div>
                      <span class="k">Trigger</span>
                      <span class="v">
                        <span class="badge badge-muted" x-text="a.trigger || '—'"></span>
                        <span class="muted small" x-text="a.schedule_human ? ' ' + a.schedule_human : ''"></span>
                      </span>
                    </div>
                    <div>
                      <span class="k">Lagi ngapain</span>
                      <span class="v"
                            x-text="a.last_activity ? (a.last_activity.summary + ' (' + fmtTanggal(a.last_activity.date) + ')') : 'Belum ada aktivitas tercatat'"></span>
                    </div>
                    <div>
                      <span class="k">Selanjutnya</span>
                      <span class="v" x-text="agentNext(a)"></span>
                    </div>
                  </div>
                  <div class="flow" x-show="(a.consumes || []).length || (a.outputs || []).length">
                    <template x-for="cn in a.consumes || []" :key="cn">
                      <span class="chip" x-text="cn"></span>
                    </template>
                    <span class="arr" x-show="(a.consumes || []).length">→</span>
                    <span class="badge badge-accent" x-text="a.id"></span>
                    <span class="arr" x-show="(a.outputs || []).length">→</span>
                    <template x-for="o in a.outputs || []" :key="o">
                      <span class="chip" x-text="o"></span>
                    </template>
                  </div>
                  <div class="agent-foot">
                    <span class="chip" x-text="'≈ ' + fmt(a.tokens_avg) + ' token/run'"></span>
                    <span class="chip" x-text="(a.instinct_count || 0) + ' instinct'"></span>
                    <span class="badge" :class="a.enabled ? 'badge-ok' : 'badge-err'"
                          x-text="a.enabled ? 'enabled' : 'disabled'"></span>
                  </div>
                </article>
              </template>
            </div>
          </section>
        </template>

        <!-- ============ VIEW: PIPELINE ============ -->
        <template x-if="view === 'pipeline' && data">
          <section class="view">
            <div class="card">
              <div class="chain-head">
                <div class="seg" x-show="(data.chains || []).length">
                  <template x-for="(c, ci) in data.chains || []" :key="c.id">
                    <button :class="{ active: chainSel === ci }" @click="chainSel = ci" x-text="c.id"></button>
                  </template>
                </div>
                <div class="chain-meta muted small" x-show="currentChain">
                  <span x-text="currentChain?.schedule_human || ''"></span>
                  <span x-show="currentChain?.on_error">
                    on_error: <b x-text="currentChain?.on_error"></b>
                  </span>
                  <span class="countdown" x-show="chainNextItem"
                        x-text="chainNextItem ? countdown(chainNextItem.next) : ''"></span>
                </div>
              </div>
              <template x-if="!currentChain">
                <div class="empty"><span class="emo">⛓️</span><p>Belum ada chain terdefinisi.</p></div>
              </template>
              <div class="chain-flow" x-show="currentChain">
                <template x-for="(st, si) in currentChain?.steps || []" :key="si">
                  <div class="step-wrap">
                    <div class="pedge" x-show="si > 0" :style="'--d:' + (si * 0.22) + 's'"></div>
                    <div class="pstep" :class="{ parallel: (st.skills || []).length > 1 }">
                      <span class="pstep-cap" x-text="'Step ' + (si + 1)"></span>
                      <template x-for="sk in st.skills || []" :key="sk">
                        <button class="pnode" @click="nodeClick(sk)">
                          <span class="pname" x-text="nodeName(sk)"></span>
                          <span class="pmodel" x-text="agentById(sk)?.model_short || sk"></span>
                        </button>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </div>

            <div class="card">
              <p class="eyebrow">Funnel kandidat per status</p>
              <div class="chart-wrap"><canvas id="chartFunnel"></canvas></div>
            </div>

            <div class="card">
              <p class="eyebrow">Kandidat</p>
              <div class="tbl-controls">
                <input class="input" type="search" placeholder="Cari ID, nama, brand, kategori…" x-model="q">
                <select class="input" x-model="statusFilter">
                  <template x-for="s in candidateStatuses" :key="s">
                    <option :value="s" x-text="statusLabel(s)"></option>
                  </template>
                </select>
              </div>
              <p class="muted small" style="margin:0 0 8px"
                 x-text="fmt(filteredCandidates.length) + ' kandidat ditampilkan'"></p>
              <template x-if="!filteredCandidates.length">
                <div class="empty">
                  <span class="emo">🔍</span>
                  <p>Tidak ada kandidat yang cocok.</p>
                  <p class="small">Coba ubah kata kunci atau filter status.</p>
                </div>
              </template>
              <div class="tbl-scroll" x-show="filteredCandidates.length">
                <table class="tbl">
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Nama</th>
                      <th>Brand</th>
                      <th>Kategori</th>
                      <th>Status</th>
                      <th class="th-sort" @click="setSort('skor')">Skor <span x-text="sortArrow('skor')"></span></th>
                      <th class="th-sort" @click="setSort('wps')">WPS <span x-text="sortArrow('wps')"></span></th>
                      <th class="th-sort" @click="setSort('tanggal')">Tanggal <span x-text="sortArrow('tanggal')"></span></th>
                    </tr>
                  </thead>
                  <template x-for="c in filteredCandidates" :key="c.id">
                    <tbody>
                      <tr class="row-main" @click="toggleExpand(c.id)">
                        <td class="mono" x-text="c.id"></td>
                        <td x-text="c.nama || '—'"></td>
                        <td x-text="c.brand || '—'"></td>
                        <td x-text="c.kategori || '—'"></td>
                        <td><span class="badge" :class="statusBadgeClass(c.status)" x-text="statusLabel(c.status)"></span></td>
                        <td class="num-tab" x-text="c.skor ?? '—'"></td>
                        <td class="num-tab" x-text="c.wps ?? '—'"></td>
                        <td class="num-tab" x-text="fmtTanggal(c.tanggal)"></td>
                      </tr>
                      <tr class="row-detail" x-show="expandId === c.id">
                        <td colspan="8">
                          <b>Alasan:</b> <span x-text="c.alasan || '—'"></span>
                          <template x-if="c.alasan_gatekeeper">
                            <span> · <b>Gatekeeper:</b> <span x-text="c.alasan_gatekeeper"></span></span>
                          </template>
                          <span x-show="c.negara_asal"> · <b>Asal:</b> <span x-text="c.negara_asal"></span></span>
                        </td>
                      </tr>
                    </tbody>
                  </template>
                </table>
              </div>
            </div>
          </section>
        </template>

        <!-- ============ VIEW: REPORTS ============ -->
        <template x-if="view === 'reports' && data">
          <section class="view">

            <!-- Mode baca markdown -->
            <template x-if="reportOpen">
              <div class="view">
                <div>
                  <button class="btn-ghost" @click="reportOpen = null">← Kembali ke daftar</button>
                </div>
                <article class="card md-card">
                  <div class="md-body" x-html="reportOpen.html"></div>
                </article>
              </div>
            </template>

            <!-- Mode daftar -->
            <template x-if="!reportOpen">
              <div class="view">
                <div class="card">
                  <p class="eyebrow">Skor WPS — kandidat dilaporkan</p>
                  <template x-if="!(data.reported || []).length">
                    <div class="empty">
                      <span class="emo">📊</span>
                      <p>Belum ada kandidat yang dilaporkan.</p>
                    </div>
                  </template>
                  <div class="tbl-scroll" x-show="(data.reported || []).length">
                    <table class="tbl">
                      <thead>
                        <tr><th>Rank</th><th>ID</th><th>Nama</th><th>WPS</th><th>W1–W5</th><th>QA</th></tr>
                      </thead>
                      <tbody>
                        <template x-for="r in data.reported || []" :key="r.id">
                          <tr>
                            <td class="num-tab" x-text="r.rank ?? '—'"></td>
                            <td class="mono" x-text="r.id"></td>
                            <td x-text="r.nama || '—'"></td>
                            <td><b class="num-tab" x-text="r.wps ?? '—'"></b></td>
                            <td>
                              <span class="wbars">
                                <template x-for="(wv, wi) in r.w || []" :key="wi">
                                  <span class="wbar"
                                        :style="'height:' + Math.max((Math.min(wv, 5) / 5) * 22, 3) + 'px'"
                                        :title="'W' + (wi + 1) + ' = ' + wv"></span>
                                </template>
                              </span>
                            </td>
                            <td>
                              <!-- Sel QA digest verbatim: 'PASS (FAIL→fix→PASS)' = lolos pasca-bounce → tetap hijau -->
                              <span class="badge" :class="/^PASS\b/.test(r.qa || '') ? 'badge-ok' : 'badge-err'"
                                    x-text="r.qa || '—'"></span>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>

                <div class="seg">
                  <button :class="{ active: reportTab === 'dossiers' }" @click="reportTab = 'dossiers'"
                          x-text="'Dossier (' + reportCounts.dossiers + ')'"></button>
                  <button :class="{ active: reportTab === 'briefs' }" @click="reportTab = 'briefs'"
                          x-text="'Brief (' + reportCounts.briefs + ')'"></button>
                  <button :class="{ active: reportTab === 'digests' }" @click="reportTab = 'digests'"
                          x-text="'Digest (' + reportCounts.digests + ')'"></button>
                </div>

                <div class="card">
                  <template x-if="!reportList(reportTab).length">
                    <div class="empty">
                      <span class="emo">📄</span>
                      <p>Belum ada dokumen di kategori ini.</p>
                      <p class="small">Dokumen muncul setelah pipeline menghasilkan laporan.</p>
                    </div>
                  </template>
                  <div class="report-list">
                    <template x-for="(item, ii) in reportList(reportTab)" :key="item.id || item.week || ii">
                      <button class="report-item" @click="openMd(reportTab, item)">
                        <span class="ri-title" x-text="item.title || item.week || item.id"></span>
                        <span class="ri-meta">
                          <span class="chip mono" x-text="item.id || item.week || ''"></span>
                          <span class="chevron">›</span>
                        </span>
                      </button>
                    </template>
                  </div>
                </div>
              </div>
            </template>
          </section>
        </template>

        <!-- ============ VIEW: OPS ============ -->
        <template x-if="view === 'ops' && data">
          <section class="view">
            <div class="card">
              <div class="card-head-row">
                <p class="eyebrow">Budget token mingguan</p>
                <span class="badge" :class="budgetBadgeClass" x-text="budgetBadge"></span>
              </div>
              <p style="margin:0">
                <b class="num-tab" x-text="fmt(data.budget?.last_cycle_total)"></b>
                dari <span class="num-tab" x-text="fmt(data.budget?.threshold_weekly)"></span> token
                (<span class="num-tab" x-text="Math.round(budgetRatio * 100) + '%'"></span> siklus terakhir)
              </p>
              <div class="progress">
                <span :style="'width:' + Math.min(budgetRatio * 100, 100) + '%;background:' + budgetBarColor"></span>
              </div>
              <template x-if="!tokensPerSkill.length">
                <div class="empty">
                  <span class="emo">🧮</span>
                  <p>Belum ada pengukuran token per skill.</p>
                </div>
              </template>
              <div class="chart-wrap tall" x-show="tokensPerSkill.length">
                <canvas id="chartBudget"></canvas>
              </div>
            </div>

            <div class="grid-2">
              <div class="card">
                <p class="eyebrow">QA bounce</p>
                <p class="muted small" style="margin:0 0 8px" x-show="data.qa?.note" x-text="data.qa?.note"></p>
                <template x-if="!qaBounceRows.length">
                  <div class="empty">
                    <span class="emo">✅</span>
                    <p>Tidak ada bounce — semua dossier lolos QA.</p>
                  </div>
                </template>
                <table class="tbl" x-show="qaBounceRows.length">
                  <thead><tr><th>Kandidat</th><th>Bounce</th></tr></thead>
                  <tbody>
                    <template x-for="b in qaBounceRows" :key="b.id">
                      <tr>
                        <td class="mono" x-text="b.id"></td>
                        <td><span class="badge badge-warn" x-text="b.n + '×'"></span></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>

              <div class="card">
                <p class="eyebrow">Issues</p>
                <template x-if="!(data.issues || []).length">
                  <div class="empty">
                    <span class="emo">🎉</span>
                    <p>Tidak ada issue terbuka.</p>
                  </div>
                </template>
                <div x-show="(data.issues || []).length">
                  <template x-for="iss in data.issues || []" :key="iss.id">
                    <div class="issue-row">
                      <span class="mono muted" x-text="iss.id"></span>
                      <span class="t" x-text="iss.title"></span>
                      <span class="badge" :class="severityBadgeClass(iss.severity)" x-text="iss.severity"></span>
                      <span class="badge badge-muted" x-text="iss.status"></span>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <h2 class="sec-title">Instincts per skill</h2>
            <div>
              <template x-if="!(data.instincts || []).length">
                <div class="card">
                  <div class="empty">
                    <span class="emo">🧠</span>
                    <p>Belum ada instinct yang dipelajari.</p>
                    <p class="small">reflect-and-learn akan menulis pelajaran atomik di sini.</p>
                  </div>
                </div>
              </template>
              <template x-for="ins in data.instincts || []" :key="ins.skill">
                <div class="acc">
                  <button class="acc-head" @click="toggleInstinct(ins.skill)">
                    <span x-text="ins.skill"></span>
                    <span style="display:inline-flex;align-items:center;gap:8px">
                      <span class="chip" x-text="(ins.items || []).length + ' item'"></span>
                      <span class="chevron" :class="{ rot: openInstinct === ins.skill }">›</span>
                    </span>
                  </button>
                  <div class="acc-body" x-show="openInstinct === ins.skill">
                    <template x-for="it in ins.items || []" :key="it.id">
                      <div class="instinct-item">
                        <span class="mono muted small" x-text="it.id"></span>
                        <p style="margin:3px 0 0" x-text="it.lesson"></p>
                        <div class="conf-bar" :title="'confidence ' + Math.round((it.confidence || 0) * 100) + '%'">
                          <span :style="'width:' + Math.round((it.confidence || 0) * 100) + '%'"></span>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </section>
        </template>

        <!-- ============ VIEW: FEEDBACK ============ -->
        <template x-if="view === 'feedback' && data">
          <section class="view">
            <h2 class="sec-title">Antrean feedback</h2>
            <div class="card">
              <template x-if="!(data.feedback_queue || []).length">
                <div class="empty">
                  <span class="emo">📮</span>
                  <p>Antrean kosong — belum ada feedback masuk.</p>
                  <p class="small">Kirim perintah lewat Telegram di bawah untuk mengantre riset baru.</p>
                </div>
              </template>
              <div x-show="(data.feedback_queue || []).length">
                <template x-for="(item, qi) in data.feedback_queue || []" :key="qi">
                  <div class="queue-item mono" x-text="queueItemText(item)"></div>
                </template>
              </div>
            </div>

            <h2 class="sec-title">Perintah Telegram</h2>
            <div class="card">
              <p style="margin:0">
                Bot: <b x-text="data.telegram?.bot || '—'"></b>
                <span class="muted small"> — salin contoh perintah lalu kirim ke bot.</span>
              </p>
              <template x-if="!(data.telegram?.commands || []).length">
                <div class="empty">
                  <span class="emo">💬</span>
                  <p>Belum ada perintah terdaftar.</p>
                </div>
              </template>
              <div class="cmd-grid">
                <template x-for="cm in data.telegram?.commands || []" :key="cm.contoh">
                  <div class="cmd-card">
                    <code x-text="cm.contoh"></code>
                    <p class="muted small" x-text="cm.fungsi"></p>
                    <button class="btn-ghost tiny" @click="copy(cm.contoh)"
                            x-text="copied === cm.contoh ? 'Tersalin ✓' : 'Salin'"></button>
                  </div>
                </template>
              </div>
            </div>
          </section>
        </template>

      </main>
    </div>

    <!-- ============ PANEL DETAIL AGENT (slide-in) ============ -->
    <div class="panel-backdrop" x-show="panelOpen" x-transition.opacity.duration.250ms
         @click="closePanel()" x-cloak></div>
    <aside class="side-panel" :class="{ open: panelOpen }" x-cloak
           @keydown.escape.window="closePanel()">
      <template x-if="selectedAgent">
        <div>
          <div class="panel-head">
            <h2 x-text="selectedAgent.nama || selectedAgent.id"></h2>
            <button class="icon-btn" @click="closePanel()" aria-label="Tutup panel">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M6 6l12 12M18 6L6 18"/>
              </svg>
            </button>
          </div>
          <p class="muted small mono" x-text="selectedAgent.id"></p>
          <div class="p-badges">
            <span class="badge badge-accent" x-text="selectedAgent.model || selectedAgent.model_short || '—'"></span>
            <span class="badge badge-muted" x-text="'trigger: ' + (selectedAgent.trigger || '—')"></span>
            <span class="badge" :class="selectedAgent.enabled ? 'badge-ok' : 'badge-err'"
                  x-text="selectedAgent.enabled ? 'enabled' : 'disabled'"></span>
          </div>

          <div class="p-sec">
            <h4>Peran</h4>
            <p x-text="selectedAgent.peran || '—'"></p>
          </div>

          <div class="p-sec">
            <h4>Jadwal</h4>
            <p>
              <span x-text="selectedAgent.schedule_human || '—'"></span>
              <span class="mono muted small" x-show="selectedAgent.schedule_cron"
                    x-text="' · cron: ' + selectedAgent.schedule_cron"></span>
            </p>
            <p class="muted small" style="margin-top:4px">
              Selanjutnya: <span x-text="agentNext(selectedAgent)"></span>
            </p>
          </div>

          <div class="p-sec">
            <h4>Definition of Done</h4>
            <p x-text="selectedAgent.dod || '—'"></p>
          </div>

          <div class="p-sec">
            <h4>Alur data</h4>
            <div class="flow">
              <template x-for="cn in selectedAgent.consumes || []" :key="cn">
                <span class="chip" x-text="cn"></span>
              </template>
              <span class="arr" x-show="(selectedAgent.consumes || []).length">→</span>
              <span class="badge badge-accent" x-text="selectedAgent.id"></span>
              <span class="arr" x-show="(selectedAgent.outputs || []).length">→</span>
              <template x-for="o in selectedAgent.outputs || []" :key="o">
                <span class="chip" x-text="o"></span>
              </template>
            </div>
          </div>

          <div class="p-sec">
            <h4>Aktivitas terakhir</h4>
            <p x-text="selectedAgent.last_activity
                 ? (selectedAgent.last_activity.summary + ' (' + fmtTanggal(selectedAgent.last_activity.date) + ')')
                 : 'Belum ada aktivitas tercatat'"></p>
          </div>

          <div class="p-sec">
            <h4>Statistik</h4>
            <div class="p-stat-row">
              <div class="p-stat">
                <span class="num" x-text="fmt(selectedAgent.tokens_avg)"></span>
                <span class="lbl">token rata-rata / run</span>
              </div>
              <div class="p-stat">
                <span class="num" x-text="selectedAgent.instinct_count ?? 0"></span>
                <span class="lbl">instinct dipelajari</span>
              </div>
            </div>
          </div>

          <div class="p-sec" x-show="agentInstincts(selectedAgent.id).length">
            <h4>Instincts</h4>
            <template x-for="it in agentInstincts(selectedAgent.id)" :key="it.id">
              <div class="instinct-item">
                <span class="mono muted small" x-text="it.id"></span>
                <p style="margin:3px 0 0" x-text="it.lesson"></p>
                <div class="conf-bar" :title="'confidence ' + Math.round((it.confidence || 0) * 100) + '%'">
                  <span :style="'width:' + Math.round((it.confidence || 0) * 100) + '%'"></span>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </aside>

  </div>
</body>
</html>
